<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハローワークに求人を出している。それでも、応募が来ない会社へ。｜株式会社スケッチ</title>
<meta name="description" content="ハローワークに求人を出しても応募が来ない中小企業様へ。求人票の見直しポイントをまとめたホワイトペーパーを無料配布中です。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f0; }
  .lp {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
  }
  .section {
    position: relative;
    width: 100%;
    line-height: 0; /* 画像下の隙間を防ぐ */
  }
  .section img {
    width: 100%;
    height: auto;
    display: block;
  }
  .hotspot {
    position: absolute;
    display: block;
    /* デバッグ用に見たいときは以下のコメントを外す */
    /* background: rgba(255,0,0,0.3); */
  }
</style>
</head>
<body>

<div class="lp">

  <!-- ① ファーストビュー -->
  <div class="section">
    <img src="hw_1.png" alt="ハローワークに求人を出している。それでも、応募が来ない会社へ。原因は、求人票の伝え方かもしれません。">
    <a class="hotspot" href="#cta" aria-label="ホワイトペーパー無料配布中"
       style="left:5.7%; top:86.2%; width:86.92%; height:9.82%;"></a>
  </div>

  <!-- ② 共感 -->
  <div class="section">
    <img src="hw_2.png" alt="『無料だから仕方ない』と、諦めていませんか？">
  </div>

  <!-- ③ 意外性＋実績 -->
  <div class="section">
    <img src="hw_3.png" alt="求人票の言葉を変えただけではありません。福井県の製造業、応募0名から22名、採用3名の実績。">
  </div>

  <!-- ④ 最終CTA -->
  <div class="section" id="cta">
    <img src="hw_4.png" alt="『応募が来ない』と諦める前に。効果改善ポイントが1冊でわかる資料を、無料でダウンロード。">
    <!-- ▼リンク先は仮URLです。HPのダウンロードページ公開後、正式URLに差し替えてください -->
    <a class="hotspot" href="https://sketch-consulting.co.jp/download/" aria-label="無料でダウンロード"
       style="left:11.6%; top:82.4%; width:77.85%; height:9.28%;"></a>
  </div>

</div>

</body>
</html>
